name: Genera el paquet

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# El flux només llegeix el repositori: no publica res ni fa servir secrets.
permissions:
  contents: read

# Una execució nova cancel·la l'anterior de la mateixa branca.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paquet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Accions fixades per commit perquè una etiqueta es pot moure.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Genera el .vsix
        run: npx --yes @vscode/vsce@4.0.0 package
      - name: Desa el .vsix com a artefacte
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-language-pack-ca
          path: "*.vsix"
          if-no-files-found: error
